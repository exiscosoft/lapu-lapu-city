# legislative Department Pages
# This file contains all the pages/governments/departments/legislative available under the Department
#
layout: grid
title: 'Legislative Department'
description: 'As of the 2025–2028 term, the Sangguniang Panlungsod (City Council) of Lapu-Lapu City has 12 elected councilors, with the Vice Mayor as the presiding officer of the council.'
pages:
  - name: 'Rufo Y. Bering'
    description: 'Councilor Rufo Y. Bering serves as a member of the Lapu-Lapu City Council and chairs the committees on Environment, Natural Resources, and Climate Change Adaptation, as well as Ethics and Good Governance. He advocates for environmental sustainability and transparent governance in the city.'
  - name: 'Annabeth D. Cuizon'
    description: 'Councilor Annabeth D. Cuizon focuses on community welfare and public service programs. She chairs committees related to Finance and Appropriations and Social Services, helping oversee city budgeting and initiatives for senior citizens and persons with disabilities.'
  - name: 'Marciano A. Alforque Jr.'
    description: 'Councilor Marciano “Jun” A. Alforque Jr. contributes to policy development on disaster preparedness and fiscal matters. He currently leads the Disaster Risk Reduction and Management Committee and the Ways and Means Committee, supporting city resilience and effective governance.'
  - name: 'Celestino C. Aying'
    description: 'Councilor Celestino “Tino” C. Aying works on programs supporting workers and marginalized communities. He chairs committees on Labor and Employment and Urban Poor and Cultural Minorities, focusing on social inclusion and livelihood opportunities.'
  - name: 'Linda Susan C. Baring'
    description: 'Councilor Linda Susan C. Baring is involved in initiatives related to governance, planning, and public service. She leads committees responsible for Human Resources Development, Urban Planning and Housing, and Laws and Human Rights.'
  - name: 'Jan Vincent A. Dela Serna'
    description: 'Councilor Jan Vincent “Janvi” A. Dela Serna supports programs for youth engagement, sports development, and community safety. He chairs committees on Sports Development, Games and Amusement, and Police and Public Safety.'
  - name: 'Efren T. Herrera'
    description: 'Councilor Efren T. Herrera focuses on infrastructure and city development. He chairs the Infrastructure and Public Works Committee, helping oversee improvements to roads, public facilities, and other city projects.'
  - name: 'Ariane Neil Marie Yap'
    description: 'Councilor Ariane Neil Marie Yap works on economic development and technology initiatives. She chairs committees on Business and Industry, Energy and Power, Information and Communication Technology, and Children, Women and Family.'
  - name: 'Climaco A. Tatoy Jr.'
    description: 'Councilor Climaco “Tata” A. Tatoy Jr. focuses on consumer welfare and public market operations. He chairs the committee responsible for Markets, Abattoir, and Consumer Protection, supporting fair trade and public market management.'
  - name: 'Jeorgen Eyas-Book'
    description: 'Councilor Jeorgen Eyas-Book advocates for inclusive governance and gender equality. He chairs committees related to Accreditation of Civil Society Organizations and Gender and Development (GAD).'
  - name: 'Joseph T. Pangantungan'
    description: 'Councilor Joseph T. Pangantungan focuses on community development and economic empowerment. He chairs committees on Cooperatives and Livelihood, Tourism, and Traffic and Transportation, supporting economic growth and mobility in the city.'
  - name: 'Emilio L. Galaroza Jr.'
    description: 'Councilor Emilio L. Galaroza Jr. leads initiatives promoting public health and community safety. He chairs committees on Health and Hospital Services and Anti-Drug Abuse and Drug Trafficking, supporting programs that protect and improve the well-being of residents.'
