# Citizen's Charter → site content map
#
# Records where every section of the Lapu-Lapu City Citizen's Charter ended up
# on this site. The charter PDFs are published at
# https://lapulapucitygov.ph/citizen-charter and were converted to markdown in
# citizen-charter/<file>.md (gitignored). When the city republishes its
# charter, use this map to find the pages that need updating.
#
# Targets:
#   services/<category>/<slug>      task page (friendly guide + verbatim tables)
#   government/departments/<slug>   office page (profile, links, office-only
#                                   services shown verbatim)
#
# Each source lists its PDF, its office page, and one target per section
# heading. `profile` sections (mandate, vision, contact, etc.) go on the
# office page.

